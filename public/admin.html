<!DOCTYPE html>
<html lang="ur-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/"><span class="logo-mark">▶</span>Admin Panel</a>
      <div class="spacer"></div>
      <a class="nav-link" href="/">← Website dekhein</a>
      <button id="logout" class="btn secondary small" hidden>Logout</button>
    </div>
  </header>

  <main id="loginView" class="container">
    <div class="login-wrap panel">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Login</button>
        <div id="loginMsg" class="msg err"></div>
      </form>
    </div>
  </main>

  <main id="dashView" class="container" hidden>
    <div id="storageWarn" class="msg err" style="margin-bottom:18px"></div>

    <section class="panel">
      <h2>Video add karein</h2>
      <div class="tabs">
        <button class="tab active" data-tab="single" type="button">Ek video</button>
        <button class="tab" data-tab="bulk" type="button">Bohat si videos</button>
      </div>

      <form id="singleForm">
        <label for="link">Google Drive link ya File ID *</label>
        <input id="link" type="text" placeholder="https://drive.google.com/file/d/XXXX/view  ya sirf File ID" required>
        <label for="title">Title</label>
        <input id="title" type="text" maxlength="150" placeholder="Video ka naam">
        <label for="desc">Description (optional)</label>
        <input id="desc" type="text" maxlength="500" placeholder="Chhoti si tafseel">
        <button class="btn" type="submit">Add karein</button>
      </form>

      <form id="bulkForm" hidden>
        <label for="bulk">Har line mein ek video</label>
        <textarea id="bulk" placeholder="https://drive.google.com/file/d/AAA.../view | Pehli video&#10;https://drive.google.com/file/d/BBB.../view | Doosri video"></textarea>
        <div class="hint">Format: link-ya-ID | title (title optional hai)</div>
        <button class="btn" type="submit">Sab add karein</button>
      </form>

      <div id="addMsg" class="msg"></div>
      <p class="hint">Drive mein video ki sharing "Anyone with the link → Viewer" honi chahiye.</p>
    </section>

    <section class="panel">
      <h2>Maujooda videos <span id="total" class="count"></span></h2>
      <div id="list" class="list"></div>
    </section>
  </main>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var password = sessionStorage.getItem('adminPw') || '';

  function thumbUrl(id) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w320'; }

  function api(action, body) {
    return fetch('/api?a=' + action, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok && !(d && d.skipped)) { var e = new Error((d && d.error) || ('Error ' + r.status)); e.data = d; throw e; }
        if (!r.ok) { var e2 = new Error('skipped'); e2.data = d; throw e2; }
        return d;
      });
    });
  }

  function showMsg(el, text, type) { el.textContent = text; el.className = 'msg show ' + type; }

  function login(pw, silent) {
    password = pw;
    api('login', {}).then(function (d) {
      sessionStorage.setItem('adminPw', pw);
      $('loginView').hidden = true; $('dashView').hidden = false; $('logout').hidden = false;
      if (!d.storage) {
        showMsg($('storageWarn'), 'Dhyan: Upstash Redis connect nahi hai, isliye yahan se add/delete save nahi hoga. Videos api/index.js ki SEED list se aati hain. README mein 2 minute ka Upstash setup likha hai.', 'err');
      } else { $('storageWarn').className = 'msg'; }
      loadList();
    }).catch(function (e) {
      password = ''; sessionStorage.removeItem('adminPw');
      if (!silent) showMsg($('loginMsg'), e.message, 'err');
    });
  }

  $('loginForm').addEventListener('submit', function (e) { e.preventDefault(); login($('pw').value); });
  $('logout').addEventListener('click', function () { sessionStorage.removeItem('adminPw'); location.reload(); });
  if (password) login(password, true);

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === t); });
      $('singleForm').hidden = t.dataset.tab !== 'single';
      $('bulkForm').hidden = t.dataset.tab !== 'bulk';
      $('addMsg').className = 'msg';
    });
  });

  function summarize(r) {
    var lines = [];
    if (r.added && r.added.length) lines.push('✓ ' + r.added.length + ' video add ho gayi.');
    (r.skipped || []).forEach(function (s) { lines.push('• Skip: ' + String(s.input).slice(0, 60) + ' — ' + s.reason); });
    return lines.join('\n');
  }

  function submitItems(items, btn) {
    btn.disabled = true;
    return api('add', { items: items }).then(function (r) {
      showMsg($('addMsg'), summarize(r), r.skipped && r.skipped.length ? 'err' : 'ok');
      return true;
    }).catch(function (e) {
      var d = e.data || {};
      showMsg($('addMsg'), d.skipped ? summarize(d) : e.message, 'err');
      return false;
    }).then(function (ok) { btn.disabled = false; loadList(); return ok; });
  }

  $('singleForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    submitItems([{ link: $('link').value, title: $('title').value, description: $('desc').value }], form.querySelector('button[type=submit]'))
      .then(function (ok) { if (ok) form.reset(); });
  });

  $('bulkForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var items = $('bulk').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) {
      var i = l.indexOf('|');
      return i === -1 ? { link: l } : { link: l.slice(0, i).trim(), title: l.slice(i + 1).trim() };
    });
    if (!items.length) return showMsg($('addMsg'), 'Kam az kam ek line likhein.', 'err');
    submitItems(items, e.target.querySelector('button[type=submit]')).then(function (ok) { if (ok) $('bulk').value = ''; });
  });

  function loadList() {
    var list = $('list');
    fetch('/api?a=list').then(function (r) { return r.json(); }).then(function (videos) {
      if (!Array.isArray(videos)) videos = [];
      $('total').textContent = videos.length ? '(' + videos.length + ')' : '';
      list.innerHTML = '';
      if (!videos.length) { list.innerHTML = '<p class="hint">Abhi koi video nahi hai.</p>'; return; }
      videos.slice().reverse().forEach(function (v) {
        var row = document.createElement('div'); row.className = 'row';
        var img = document.createElement('img'); img.src = thumbUrl(v.id); img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        img.onerror = function () { img.style.visibility = 'hidden'; };
        var main = document.createElement('div'); main.className = 'row-main';
        var t = document.createElement('div'); t.className = 'row-title'; t.textContent = v.title;
        var id = document.createElement('div'); id.className = 'row-id'; id.textContent = v.id;
        main.appendChild(t); main.appendChild(id);
        var actions = document.createElement('div'); actions.className = 'row-actions';

        var rename = document.createElement('button'); rename.className = 'btn secondary small'; rename.textContent = 'Rename';
        rename.onclick = function () {
          var nt = prompt('Naya title:', v.title);
          if (!nt || !nt.trim()) return;
          api('rename', { id: v.id, title: nt }).then(loadList).catch(function (e) { alert(e.message); });
        };
        var del = document.createElement('button'); del.className = 'btn danger small'; del.textContent = 'Delete';
        del.onclick = function () {
          if (!confirm('"' + v.title + '" ko website se hata dein?\n(Drive se file delete nahi hogi.)')) return;
          api('delete', { id: v.id }).then(loadList).catch(function (e) { alert(e.message); });
        };
        actions.appendChild(rename); actions.appendChild(del);
        row.appendChild(img); row.appendChild(main); row.appendChild(actions);
        list.appendChild(row);
      });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
